name: salespilot-enterprise

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salespilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-salespilot_rag}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-salespilot} -d $${POSTGRES_DB:-salespilot_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-salespilot-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    restart: unless-stopped
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set KC_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:8080:8080"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 6G
    environment:
      SALESPILOT_PROFILE: enterprise
      SALESPILOT_RAG_MODE: ${SALESPILOT_RAG_MODE:-demo}
      SALESPILOT_RAG_STORE_BACKEND: postgres
      SALESPILOT_POSTGRES_DSN: postgresql://${POSTGRES_USER:-salespilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-salespilot_rag}
      SALESPILOT_REDIS_URL: redis://redis:6379/0
      SALESPILOT_OBJECT_STORE_BACKEND: s3
      SALESPILOT_S3_ENDPOINT_URL: http://minio:9000
      SALESPILOT_S3_BUCKET: ${SALESPILOT_S3_BUCKET:-salespilot-docs}
      SALESPILOT_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-salespilot-minio}
      SALESPILOT_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      SALESPILOT_DEMO_PASSWORD_A: ${SALESPILOT_DEMO_PASSWORD_A:-}
      SALESPILOT_DEMO_PASSWORD_B: ${SALESPILOT_DEMO_PASSWORD_B:-}
      SALESPILOT_MODEL_CONFIG_KEY: ${SALESPILOT_MODEL_CONFIG_KEY:?set SALESPILOT_MODEL_CONFIG_KEY in .env}
      SALESPILOT_MODEL_ALLOWED_BASE_URLS: ${SALESPILOT_MODEL_ALLOWED_BASE_URLS:-}
      SALESPILOT_OIDC_ISSUER: ${SALESPILOT_OIDC_ISSUER:-http://keycloak:8080/realms/salespilot}
      SALESPILOT_OIDC_AUDIENCE: ${SALESPILOT_OIDC_AUDIENCE:-salespilot-web}
      SALESPILOT_OIDC_DEFAULT_ORG: ${SALESPILOT_OIDC_DEFAULT_ORG:-}
      SALESPILOT_WEB_ORIGINS: ${SALESPILOT_WEB_ORIGINS:-http://127.0.0.1:4173,http://localhost:4173}
      SALESPILOT_SECURE_COOKIE: ${SALESPILOT_SECURE_COOKIE:-false}
    volumes:
      - appstate:/srv/salespilot/.salespilot

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_BIND_HOST:-0.0.0.0}:${WEB_PORT:-4173}:80"

volumes:
  pgdata:
  redisdata:
  miniodata:
  appstate:
